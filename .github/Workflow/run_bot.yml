name: Run Custom Discord Bot 24/7

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *' # Automatically restarts every 5 hours to bypass timeouts

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Discord Bot in Background
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      # nohup keeps it alive, & detaches it so GitHub UI unfreezes instantly
      run: |
        nohup python bot.py > bot_output.log 2>&1 &
        sleep 5
        cat bot_output.log
