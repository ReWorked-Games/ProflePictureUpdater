name: Run Custom Discord Bot 24/7

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Discord Bot with Live Stream
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      # Python -u unbuffers the output so you see live updates instantly
      run: python -u bot.py
